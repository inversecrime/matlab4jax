# Generated by Gemini

name: Publish matlab4jax to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on Linux (Cloud)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build auditwheel

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Repair Linux wheel
        run: |
          mkdir -p dist/repaired
          auditwheel repair dist/*.whl \
            --no-update-tags \
            --exclude libMatlabEngine.so \
            --exclude libMatlabDataArray.so \
            -w dist/repaired/
          rm -f dist/*.whl
          mv dist/repaired/*.whl dist/
          rmdir dist/repaired

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts-${{ matrix.python-version }}
          path: dist/*

  publish-to-pypi:
    name: Upload to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matlab4jax
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pypi-artifacts-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
