# Generated by Gemini

name: Publish matlab4jax to PyPI

on:
  release:
    types: [published]

jobs:
  build_wheels:
    name: Build wheels on Linux (Cloud)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build auditwheel

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Repair Linux wheel
        run: |
          mkdir -p dist/repaired
          auditwheel repair dist/*.whl -w dist/repaired/

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: cloud-wheels
          path: dist/repaired/*.whl

  publish-to-pypi:
    name: Upload to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/matlab4jax
    permissions:
      id-token: write

    steps:
      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          name: cloud-wheels
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
